# SPDX-License-Identifier: GPL-2.0-or-later
#
# A tag like v0.1.0 builds, tests and packages that version, then makes a
# draft release with the installer, the portable zip and their checksums.
# Publish the draft on GitHub once its notes read right.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  check:
    name: Check the tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Match the tag to CMakeLists.txt's version
        run: |
          version=$(grep -oP 'project\(\w+ VERSION \K[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME, but CMakeLists.txt's version is $version."
            exit 1
          fi

  build:
    needs: check
    uses: ./.github/workflows/build.yml

  release:
    name: Draft the release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: packages

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name=$(grep -oP '#define KNOBS_DISPLAY_NAME "\K[^"]+' src/app_info.h)
          version=${GITHUB_REF_NAME#v}
          sed -e "s/@NAME@/$name/g" -e "s/@VERSION@/$version/g" .github/release-notes.md > notes.md
          { echo; echo '```'; cat packages/SHA256SUMS.txt; echo '```'; } >> notes.md
          gh release create "$GITHUB_REF_NAME" packages/* --draft --verify-tag --title "$name $version" --notes-file notes.md
